<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/dist/styles.css" />
    <title>Frontend Mentor | Product list with cart</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1 class="text-set1 main-header">Desserts</h1>
        <main class="content"></main>
      </div>
      <aside class="cart-container">
        <!-- ORDERS -->
      </aside>

      <!-- MODAL  -->
      <div class="modal-container visually-hidden">
        <img src="assets/images/icon-order-confirmed.svg" alt="" />
        <h2>Order Confirmed</h2>

        <div class="order">
          <div class="order__item">
            <img src="assets/images/image-tiramisu-mobile.jpg" alt="" />
            <div class="order__description">
              <p class="cart__item text-set4__bold">Classic Tiramisu</p>
              <p class="cart__order__quantity">
                <span class="text-set4__bold cart__number"
                  >1x <span class="text-set4 cart__price">@$7.00</span></span
                >
              </p>
            </div>
          </div>
          <div class="order__price">
            <span class="text-set4__bold">$5.50</span>
          </div>
        </div>

        <div class="order">
          <div class="order__item">
            <img src="assets/images/image-creme-brulee-mobile.jpg" alt="" />

            <div class="order__description">
              <p class="cart__item text-set4__bold">
                Vanilla Bean Creme Brulee
              </p>
              <p class="cart__order__quantity">
                <span class="text-set4__bold cart__number"
                  >4x <span class="text-set4 cart__price">@$7.00</span>
                </span>
              </p>
            </div>
          </div>
          <div class="order__price">
            <span class="text-set4__bold">$28.00</span>
          </div>
        </div>
        <div class="cart__order__total">
          <div class="text-set4">Order Total</div>
          <span class="text-set2">$46.50</span>
        </div>
        <button class="btn text-set3 confirm__btn">Start New Order</button>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Bryan</a>.
    </div>

    <script src="/app/js/script.js"></script>
  </body>
</html>
